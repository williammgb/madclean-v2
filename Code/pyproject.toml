[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "madclean"
version = "0.1.0"
description = "MADClean: Multi-Agent Data Cleaning"
requires-python = ">=3.9"
dependencies = [
  "python-dotenv>=1.0.0"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["madclean*"]

[project.scripts]
madclean = "madclean.main:cli"